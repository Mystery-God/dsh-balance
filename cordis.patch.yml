# dsh-balance bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add github:Mystery-God/dsh-balance`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (settings store + /api/dsh-balance routes + balance
# fetch), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the
# web GUI.
- insert:
    - id: balance
      name: '@linxin666/dsh-balance'
